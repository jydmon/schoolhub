name: Mobile — EAS build & submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: Build profile
        type: choice
        options: [production, preview]
        default: production
      submit:
        description: Submit to stores after build
        type: boolean
        default: false
  push:
    tags:
      - "mobile-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check Expo auth
        run: |
          echo "EXPO_TOKEN present: ${{ secrets.EXPO_TOKEN != '' }}"
          if ! eas whoami; then
            echo "::error::Not logged in to Expo. EXPO_TOKEN is missing or invalid. Add it under repo Settings → Secrets and variables → Actions (name it exactly EXPO_TOKEN)."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Resolve build params
        id: params
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          PROFILE="${{ github.event.inputs.profile }}"
          SUBMIT="${{ github.event.inputs.submit }}"
          [ -z "$PLATFORM" ] && PLATFORM="all"
          [ -z "$PROFILE" ] && PROFILE="production"
          [ -z "$SUBMIT" ] && SUBMIT="true"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "submit=$SUBMIT" >> "$GITHUB_OUTPUT"

      - name: Build (and optionally submit)
        run: |
          FLAGS="--platform ${{ steps.params.outputs.platform }} --profile ${{ steps.params.outputs.profile }} --non-interactive"
          if [ "${{ steps.params.outputs.submit }}" = "true" ]; then FLAGS="$FLAGS --auto-submit"; fi
          echo "Running: eas build $FLAGS"
          eas build $FLAGS
