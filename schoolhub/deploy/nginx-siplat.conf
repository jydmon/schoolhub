# SIPlat reverse proxy. Copy to /etc/nginx/sites-available/siplat, edit the
# server_name, then: ln -s to sites-enabled, `nginx -t`, `systemctl reload nginx`,
# and run certbot for HTTPS (see the guide).
server {
    listen 80;
    server_name dev.siplat.com;   # ← change to your domain/subdomain

    client_max_body_size 25M;          # allow document/video uploads

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
