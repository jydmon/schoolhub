name: Deploy to Hostinger VPS
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}       # lets you trigger a deploy manually from GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}          # your VPS IP or hostname
          username: ${{ secrets.VPS_USER }}      # e.g. deploy
          key: ${{ secrets.VPS_SSH_KEY }}        # the PRIVATE key that can SSH in
          port: ${{ secrets.VPS_PORT }}          # usually 22
          script: |
            cd /var/www/siplat
            bash deploy/deploy.sh
