name: Mobile — EAS build & submit

# Builds the SIPlat iOS (.ipa) and Android (.aab) apps on Expo Application
# Services and, optionally, submits them to App Store Connect and Google Play.
#
# Triggers:
#   • Manually (Actions → "Mobile — EAS build & submit" → Run workflow), choosing
#     platform / profile / whether to submit.
#   • Automatically when you push a tag like  mobile-v1.0.0  (builds + submits
#     the production profile for both platforms).
#
# Required repository secret:  EXPO_TOKEN  (Expo access token — create one at
#   https://expo.dev/settings/access-tokens). Store credentials (Apple + Google)
#   are configured once in EAS; see mobile/DEPLOYMENT.md.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options: ["all", "ios", "android"]
        default: "all"
      profile:
        description: "EAS build profile"
        type: choice
        options: ["production", "preview"]
        default: "production"
      submit:
        description: "Submit to the stores after build"
        type: boolean
        default: false
  push:
    tags:
      - "mobile-v*"

jobs:
  build:
    name: EAS build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Resolve build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "platform=all"        >> "$GITHUB_OUTPUT"
            echo "profile=production"  >> "$GITHUB_OUTPUT"
            echo "submit=true"         >> "$GITHUB_OUTPUT"
          else
            echo "platform=${{ inputs.platform }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ inputs.profile }}"   >> "$GITHUB_OUTPUT"
            echo "submit=${{ inputs.submit }}"     >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and optionally submit)
        run: |
          EXTRA=""
          if [ "${{ steps.params.outputs.submit }}" = "true" ]; then EXTRA="--auto-submit"; fi
          eas build \
            --platform ${{ steps.params.outputs.platform }} \
            --profile ${{ steps.params.outputs.profile }} \
            --non-interactive \
            $EXTRA
